<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="video-page">

        <img src="assets/video-background.png" class="video-background" alt="">

        <iframe
            id="youtube-video"
            class="main-video"
            src=""
            title="Video"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

        <!-- TITRE -->
        <h1 id="gh-video-title">6 bumY0ur3y3s</h1>

        <!-- AFFICHER PLUS + DESCRIPTION -->
        <div class="gh-description-wrap">
            <button class="gh-show-more" id="gh-show-more" type="button" aria-expanded="false">
                afficher plus <span aria-hidden="true">⌄</span>
            </button>
            <div class="gh-description" id="gh-description" hidden>
                <p id="gh-description-text"></p>
            </div>
        </div>

        <!-- VOTES -->
        <div class="gh-actions" aria-label="Actions sur la vidéo">
            <div class="gh-vote-group">
                <button class="gh-vote-btn" id="gh-like" type="button" aria-pressed="false">
                    <span aria-hidden="true">👍</span>
                    <span id="gh-like-count">0</span>
                </button>
                <button class="gh-vote-btn" id="gh-dislike" type="button" aria-pressed="false">
                    <span aria-hidden="true">👎</span>
                    <span id="gh-dislike-count">0</span>
                </button>
            </div>
        </div>

        <!-- COMMENTAIRES -->
        <section class="gh-comments" id="gh-comments">
            <div class="gh-comments-head">
                <h2>Commentaires</h2>
                <span id="gh-comment-count">0</span>
            </div>
            <div id="gh-comment-list" class="gh-comment-list"></div>
            <form id="gh-comment-form" class="gh-comment-form">
                <input id="gh-comment-name" name="name" type="text" maxlength="32" placeholder="Pseudo" autocomplete="off" required>
                <textarea id="gh-comment-text" name="comment" maxlength="500" rows="2" placeholder="Ajoute un commentaire..." required></textarea>
                <button type="submit">Publier</button>
            </form>
        </section>

        <!-- VIDÉOS À DROITE -->
        <div id="side-video-list" class="side-video-list"></div>

    </main>

    <script src="script.js"></script>

</body>

</html>
