<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Video</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="video-page">

        <!-- BACKGROUND DE LA PAGE VIDÉO -->
        <img
            src="assets/video-background.png"
            class="video-background"
            alt=""
        >


        <!-- VIDÉO YOUTUBE -->
        <iframe
            id="youtube-video"
            class="main-video"
            src=""
            title="Video"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>


        <!-- VIDÉOS À DROITE -->
        <div
            id="side-video-list"
            class="side-video-list"
        ></div>

    </main>


    <script src="script.js"></script>

</body>

</html>
