<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Archive</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home">

        <!-- BACKGROUND DE L'ACCUEIL -->
        <video
            class="home-background home-background-desktop"
            src="assets/home-background-desktop.mp4"
            autoplay
            loop
            muted
            playsinline
        ></video>

        <video
            class="home-background home-background-mobile"
            src="assets/home-background-mobile.mp4"
            autoplay
            loop
            muted
            playsinline
        ></video>


        <!-- LOGO -->
        <img
            src="assets/logo.png"
            class="logo"
            alt=""
        >


        <!-- 10 MINIATURES -->
        <div
            id="home-video-list"
            class="home-video-list"
        ></div>

    </main>


    <script src="script.js"></script>

</body>

</html>
